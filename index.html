<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfriNoor Kitchen POS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div>
      <h1>AfriNoor Kitchen</h1>
      <p>Point of Sale</p>
    </div>

    <div id="today"></div>
  </header>

  <main class="layout">

    <!-- MENU -->
    <section class="menu-panel">

      <div class="section-head">

        <div>
          <h2>Menu</h2>
          <p>Select a food item to add it to the order.</p>
        </div>

        <input
          id="search"
          type="search"
          placeholder="Search food..."
        >

      </div>

      <div id="categories" class="categories">

        <button class="category-btn active" data-category="All">
          All
        </button>

        <button class="category-btn" data-category="Rice">
          Rice
        </button>

        <button class="category-btn" data-category="Bhorta">
          Bhorta
        </button>

        <button class="category-btn" data-category="Curry">
          Curry
        </button>

        <button class="category-btn" data-category="Combo">
          Combo
        </button>

        <button class="category-btn" data-category="Snacks">
          Snacks
        </button>

        <button class="category-btn" data-category="Paratha">
          Paratha
        </button>

        <button class="category-btn" data-category="Bhaji">
          Bhaji
        </button>

        <button class="category-btn" data-category="Haleem">
          Haleem
        </button>

      </div>

      <div id="menu" class="menu-grid"></div>

    </section>


    <!-- CURRENT ORDER -->
    <aside class="order-panel">

      <div class="section-head">

        <div>
          <h2>Current Order</h2>
          <p id="count">0 items</p>
        </div>

        <button id="clear" class="secondary">
          Clear
        </button>

      </div>


      <div id="cart" class="cart"></div>


      <div class="totals">

        <div>
          <span>Subtotal</span>
          <strong id="subtotal">৳0</strong>
        </div>

        <div>
          <span>Discount</span>
          <strong id="discount">৳0</strong>
        </div>

        <div class="grand">
          <span>Total</span>
          <strong id="total">৳0</strong>
        </div>

      </div>


      <label>
        Discount (৳)

        <input
          id="discountInput"
          type="number"
          min="0"
          value="0"
        >

      </label>


      <label>
        Payment received (৳)

        <input
          id="paymentInput"
          type="number"
          min="0"
          value="0"
        >

      </label>


      <div class="change">

        <span>Change</span>

        <strong id="change">৳0</strong>

      </div>


      <button id="checkout" class="checkout">
        Complete Sale
      </button>

    </aside>

  </main>

<!-- SALES DASHBOARD -->
<section class="sales-dashboard">

  <div class="dashboard-header">
    <div>
      <h2>Sales Dashboard</h2>
      <p>Today's sales summary</p>
    </div>

    <button id="refreshSales" class="secondary">
      Refresh
    </button>
  </div>

  <div class="sales-cards">

    <div class="sales-card">
      <span>Total Sales</span>
      <strong id="todaySales">৳0</strong>
    </div>

    <div class="sales-card">
      <span>Orders</span>
      <strong id="todayOrders">0</strong>
    </div>

    <div class="sales-card">
      <span>Items Sold</span>
      <strong id="todayItems">0</strong>
    </div>

    <div class="sales-card">
      <span>Discounts</span>
      <strong id="todayDiscount">৳0</strong>
    </div>

  </div>

</section>

<!-- SALES HISTORY -->
<section class="sales-history">

  <div class="history-header">
    <div>
      <h2>Sales History</h2>
      <p>All completed orders</p>
    </div>

    <button id="refreshHistory" class="secondary">
      Refresh
    </button>
  </div>

  <div id="salesHistory"></div>

</section>

<div id="toast" class="toast"></div>


  <script src="app.js"></script>

</body>
</html>
